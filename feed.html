<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лента идей</title>
<meta name="description" content="Лента самодельных проектов: листай и находи, что собрать своими руками.">
<meta name="theme-color" content="#11111b">
<link rel="preload" href="assets/fonts/plex-sans-400-600-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/base.css?v=7">
<link rel="stylesheet" href="assets/feed.css?v=7">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>

<header class="top">
  <a class="round" href="index.html" title="Открыть сеткой">
    <svg class="i" aria-hidden="true"><use href="assets/icons.svg#grid"/></svg><span class="sr">Открыть сеткой</span>
  </a>
  <button type="button" id="pick" class="pick" aria-haspopup="dialog">
    <span id="pick-label">Все разделы</span>
    <svg class="i" aria-hidden="true"><use href="assets/icons.svg#caret"/></svg>
  </button>
  <button type="button" id="sound" class="round" aria-pressed="false" title="Звук">
    <svg class="i" aria-hidden="true"><use id="sound-icon" href="assets/icons.svg#mute"/></svg><span class="sr">Звук</span>
  </button>
  <span class="pos" id="pos"></span>
</header>

<div class="sheet" id="sheet" role="dialog" aria-label="Что показывать" hidden>
  <div class="sheet-card">
    <button type="button" class="row switch" id="fav-toggle" aria-pressed="false">
      <svg class="i" aria-hidden="true"><use href="assets/icons.svg#star"/></svg>
      <span>Только избранное</span>
      <span class="n" id="fav-count"></span>
      <span class="knob" aria-hidden="true"></span>
    </button>
    <div class="rows" id="sheet-list"></div>
  </div>
</div>

<main class="feed" id="feed"></main>

<p class="hint" id="hint">Листай вверх</p>

<script src="assets/feed.js?v=7"></script>
<script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
